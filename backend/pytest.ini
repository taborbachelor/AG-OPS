[pytest]
testpaths = tests
markers =
    sitl: scenario test that spawns the bundled SITL and flies it (slow; run with `pytest -m sitl` or scenarios.ps1)
    slow: long-running test
# Unit suite by default: plain `pytest` must stay fast and hardware-free.
# Scenario runs override with an explicit `-m sitl` (later -m wins).
addopts = -m "not sitl"
